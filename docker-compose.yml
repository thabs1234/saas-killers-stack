# saas-killers-stack — runnable core
# Two services verified to run with a single `docker compose up -d`:
#   - Stirling-PDF  (replaces Adobe Acrobat)  -> http://localhost:8080
#   - Listmonk+PG  (replaces Mailchimp)      -> http://localhost:9000
# Excalidraw / Cap / Dub need extra steps — see EXTENDED.md (not in this compose
# because they are not single clean containers).

services:
  stirling-pdf:
    image: frooodle/s-pdf:latest
    container_name: stirling-pdf
    ports:
      - "8080:8080"
    volumes:
      - ./data/stirling:/usr/share/tessdata
    environment:
      - SECURITY_ENABLELOGIN=false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/info/status | grep -q UP"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  listmonk:
    image: listmonk/listmonk:latest
    container_name: listmonk
    ports:
      - "9000:9000"
    environment:
      LISTMONK_app__address: "0.0.0.0:9000"
      LISTMONK_db__host: listmonk-db
      LISTMONK_db__port: "5432"
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: listmonk
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
    command: [sh, -c, "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && ./listmonk --config ''"]
    depends_on:
      listmonk-db:
        condition: service_healthy
    restart: unless-stopped

  listmonk-db:
    image: postgres:15
    container_name: listmonk-db
    environment:
      - POSTGRES_USER=listmonk
      - POSTGRES_PASSWORD=listmonk
      - POSTGRES_DB=listmonk
    volumes:
      - ./data/listmonk:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Excalidraw: no official single-container image.
  # Use excalidraw.com (free) or the Vercel one-click deploy — see EXTENDED.md.
  # Cap: desktop app from github.com/CapSoftware/Cap — not containerised here.
  # Dub: needs Postgres+Redis+Tinybird — use dubinc/dub official compose — see EXTENDED.md.
