name: stack-smoke-test
# Proves the core stack ACTUALLY RUNS (not just parses) using GitHub's free Linux
# runners, which have Docker. The core stack (Stirling-PDF + Listmonk + Excalidraw)
# is booted and curled. Cap and Dub compose files are syntax-validated (docker compose
# config) — their images require builds (Cap media-server, Dub web) that are not run
# here; see README/EXTENDED for the one-command setup scripts.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start core stack (Stirling-PDF + Listmonk + Excalidraw)
        run: docker compose up -d

      - name: Wait for Postgres to accept connections
        run: |
          for i in $(seq 1 30); do
            if docker exec listmonk-db pg_isready -U listmonk >/dev/null 2>&1; then
              echo "postgres ready after ${i} tries"; break
            fi
            echo "waiting for postgres... ($i)"; sleep 3
          done

      - name: Verify Stirling-PDF (port 8080)
        run: |
          code="000"
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/stirling.html -w "%{http_code}" --max-time 5 http://localhost:8080/api/v1/info/status || true)
            echo "attempt $i: Stirling-PDF /api/v1/info/status HTTP $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          test "$code" = "200"

      - name: Verify Listmonk (port 9000)
        run: |
          code="000"
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/listmonk.html -w "%{http_code}" --max-time 5 http://localhost:9000 || true)
            echo "attempt $i: Listmonk HTTP $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          test "$code" = "200"

      - name: Verify Excalidraw (port 5000)
        run: |
          code="000"
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/excalidraw.html -w "%{http_code}" --max-time 5 http://localhost:5000 || true)
            echo "attempt $i: Excalidraw HTTP $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          test "$code" = "200"

      - name: Validate Cap + Dub compose files (syntax only)
        run: |
          docker compose -f docker-cap.yml config >/dev/null && echo "docker-cap.yml: OK"
          docker compose -f docker-dub.yml config >/dev/null && echo "docker-dub.yml: OK"

      - name: Tear down
        if: always()
        run: |
          docker compose logs --no-color listmonk listmonk-db stirling-pdf excalidraw >> /tmp/stack.log 2>&1 || true
          docker compose down -v
          echo "=== last 40 lines of container logs (for debugging) ==="
          tail -40 /tmp/stack.log || true
